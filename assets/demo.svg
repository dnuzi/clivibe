<svg fill="none" viewBox="0 0 800 440" width="100%" height="440" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background-color: #0d1117;
          border: 1px solid #30363d;
          border-radius: 10px;
          box-shadow: 0 20px 40px rgba(0,0,0,0.6);
          color: #c9d1d9;
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
          font-size: 13px;
          line-height: 1.6;
          margin: 0;
          overflow: hidden;
          padding: 16px;
          height: 400px;
          box-sizing: border-box;
        }
        .header {
          display: flex;
          align-items: center;
          margin-bottom: 12px;
          padding-bottom: 8px;
          border-bottom: 1px solid #21262d;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .red { background-color: #ff5f56; }
        .yellow { background-color: #ffbd2e; }
        .green { background-color: #27c93f; }
        .title { color: #8b949e; font-size: 11px; margin-left: 10px; font-weight: 600; }
        .prompt { color: #58a6ff; font-weight: bold; }
        .cmd { color: #f0f6fc; }
        .cyan { color: #39c5bb; }
        .pink { color: #ff61d2; font-weight: bold; }
        .green-text { color: #3fb950; font-weight: bold; }
        .yellow-text { color: #d29922; }
        .dim { color: #8b949e; }
        .box {
          border: 1px solid #58a6ff;
          border-radius: 6px;
          padding: 8px 12px;
          margin: 8px 0;
          background: rgba(88, 166, 255, 0.05);
        }
      </style>
      <div class="container">
        <div class="header">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="title">terminal — velx — 80x24</span>
        </div>
        <div>
          <span class="prompt">❯ </span><span class="cmd">npx velx</span>
        </div>
        <div style="margin-top: 6px;">
          <span class="pink">  ██╗   ██╗███████╗██╗     ██╗  ██╗</span><br/>
          <span class="pink">  ██║   ██║██╔════╝██║     ╚██╗██╔╝</span><br/>
          <span class="pink">  ██║   ██║█████╗  ██║      ╚███╔╝ </span><br/>
          <span class="pink">  ╚██╗ ██╔╝██╔══╝  ██║      ██╔██╗ </span><br/>
          <span class="pink">   ╚████╔╝ ███████╗███████╗██╔╝ ██╗</span><br/>
          <span class="pink">    ╚═══╝  ╚══════╝╚══════╝╚═╝  ╚═╝</span>
        </div>
        <div class="dim" style="margin-bottom: 8px;">  ⚡ The Zero-Dependency Developer Cockpit [v1.0.0]</div>
        <div class="box">
          <div><span class="green-text">✔ DIAGNOSTIC REPORT</span> <span class="dim">(devpulse / velx engine)</span></div>
          <div><span class="cyan">● Node.js Runtime:</span> <span class="green-text">v20+ (Supported)</span></div>
          <div><span class="cyan">● Dependencies:</span>    <span class="green-text">0 packages required</span></div>
          <div><span class="cyan">● Memory &amp; Gauges:</span>  <span class="green-text">[████████░░░░] 34% (Healthy)</span></div>
          <div><span class="cyan">● Dev Ports:</span>        <span class="yellow-text">Port 3000 free, 5432 bound (PostgreSQL)</span></div>
        </div>
        <div>
          <span class="prompt">❯ </span><span class="cmd">velx wtf "Error: listen EADDRINUSE :::3000"</span>
        </div>
        <div style="color: #ff7b72; margin-top: 4px;">
          ✖ PORT CONFLICT — Port 3000 is occupied. Run <span class="cyan">velx kill-port 3000</span> to resolve.
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
