<svg fill="none" viewBox="0 0 900 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF61D2"/>
      <stop offset="40%" style="stop-color:#5271FF"/>
      <stop offset="100%" style="stop-color:#12D8FA"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF61D2;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#5271FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#12D8FA;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="180" fill="url(#bg)" rx="12"/>

  <!-- Accent line left -->
  <rect x="0" y="0" width="4" height="180" fill="url(#text-grad)" rx="2"/>

  <!-- Gradient bottom line -->
  <rect x="20" y="170" width="860" height="2" fill="url(#line-grad)" rx="1" opacity="0.6"/>

  <!-- CLIVIBE logo text -->
  <text x="40" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="68" font-weight="900" fill="url(#text-grad)" filter="url(#glow)" letter-spacing="-1">clivibe</text>

  <!-- Tagline -->
  <text x="42" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#8b949e">Zero-Dependency Terminal Color, Gradient &amp; UI Toolkit for Node.js</text>

  <!-- Badges below logo -->
  <rect x="42" y="145" width="82" height="18" rx="4" fill="#5271FF" opacity="0.18"/>
  <text x="50" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#5271FF">ZERO-DEP</text>

  <rect x="132" y="145" width="88" height="18" rx="4" fill="#FF61D2" opacity="0.18"/>
  <text x="140" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#FF61D2">GRADIENTS</text>

  <rect x="228" y="145" width="80" height="18" rx="4" fill="#12D8FA" opacity="0.18"/>
  <text x="236" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#12D8FA">TERMINAL UI</text>

  <!-- Right side: Terminal UI Commands preview -->
  <text x="480" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5271FF">❯</text>
  <text x="498" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">clivibe gradient &quot;SYNTHWAVE&quot;</text>

  <text x="480" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5271FF">❯</text>
  <text x="498" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">clivibe spark 5,12,18,24,35,42,58,80</text>

  <text x="480" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5271FF">❯</text>
  <text x="498" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">clivibe chart 10,25,18,34,55,42,60</text>

  <text x="480" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5271FF">❯</text>
  <text x="498" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">clivibe box &quot;Deployment complete&quot;</text>

  <text x="480" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5271FF">❯</text>
  <text x="498" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">clivibe doctor</text>
</svg>
