<svg fill="none" viewBox="0 0 900 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF61D2"/>
      <stop offset="40%" style="stop-color:#5271FF"/>
      <stop offset="100%" style="stop-color:#12D8FA"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF61D2;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#5271FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#12D8FA;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="180" fill="url(#bg)" rx="12"/>

  <!-- Accent line left -->
  <rect x="0" y="0" width="4" height="180" fill="url(#text-grad)" rx="2"/>

  <!-- Gradient bottom line -->
  <rect x="20" y="170" width="860" height="2" fill="url(#line-grad)" rx="1" opacity="0.6"/>

  <!-- VELX logo text -->
  <text x="40" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="80" font-weight="900" fill="url(#text-grad)" filter="url(#glow)" letter-spacing="-2">velx</text>

  <!-- Tagline -->
  <text x="42" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">The Zero-Dependency Developer Cockpit &amp; Swiss-Army CLI</text>

  <!-- Right side: Commands preview -->
  <text x="490" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#58a6ff">$</text>
  <text x="508" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">npx velx</text>
  <text x="490" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#58a6ff">$</text>
  <text x="508" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">velx doctor</text>
  <text x="490" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#58a6ff">$</text>
  <text x="508" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">npm run build 2>&amp;1 | velx wtf</text>
  <text x="490" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#58a6ff">$</text>
  <text x="508" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">velx git standup</text>
  <text x="490" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#58a6ff">$</text>
  <text x="508" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f0f6fc">velx cron "*/15 * * * *"</text>

  <!-- Sparkle dots -->
  <circle cx="460" cy="60" r="2" fill="#FF61D2" opacity="0.6"/>
  <circle cx="460" cy="80" r="2" fill="#5271FF" opacity="0.6"/>
  <circle cx="460" cy="100" r="2" fill="#12D8FA" opacity="0.6"/>
  <circle cx="460" cy="120" r="2" fill="#FF61D2" opacity="0.6"/>
  <circle cx="460" cy="140" r="2" fill="#5271FF" opacity="0.6"/>
</svg>
